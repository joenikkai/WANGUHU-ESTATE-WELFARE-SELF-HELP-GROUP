<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="dHexGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3B8B76"/>
      <stop offset="100%" stop-color="#2E7D64"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;400&amp;display=swap');
      .dwmark { font-family: 'Outfit', 'Trebuchet MS', sans-serif; font-weight: 700; letter-spacing: -0.5px; }
      .dsub   { font-family: 'Outfit', 'Trebuchet MS', sans-serif; font-weight: 400; fill: #94A3B8; letter-spacing: 0.3px; }
    </style>
  </defs>

  <!-- Dark surface background -->
  <rect width="560" height="120" rx="12" fill="#1A2433"/>

  <!-- ── Icon mark ── -->
  <g transform="translate(12, 12) scale(0.8)">
    <polygon
      points="60,6 110.8,33 110.8,87 60,114 9.2,87 9.2,33"
      fill="url(#dHexGrad)"
    />
    <polygon
      points="60,6 110.8,33 110.8,87 60,114 9.2,87 9.2,33"
      fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12"
    />
    <rect x="31.5" y="56"  width="9" height="32" rx="2" fill="#FFFFFF"/>
    <rect x="43.5" y="66"  width="9" height="22" rx="2" fill="#FFFFFF"/>
    <rect x="55.5" y="50"  width="9" height="38" rx="2" fill="#FFFFFF"/>
    <rect x="67.5" y="66"  width="9" height="22" rx="2" fill="#FFFFFF"/>
    <rect x="79.5" y="56"  width="9" height="32" rx="2" fill="#FFFFFF"/>
    <polyline
      points="60,50 60,36 68,43"
      fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    />
    <line x1="31.5" y1="88" x2="88.5" y2="88" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Divider -->
  <line x1="114" y1="22" x2="114" y2="98" stroke="#2D3A4A" stroke-width="1.5"/>

  <!-- Wordmark -->
  <text x="130" y="68" class="dwmark" font-size="38">
    <tspan fill="#3B8B76">WEW</tspan><tspan fill="#E2E8F0">SHG</tspan>
  </text>

  <!-- Tagline -->
  <text x="131" y="90" class="dsub" font-size="11" letter-spacing="0.8">
    Wanguhu Estate Welfare · Self Help Group
  </text>

  <!-- Badges -->
  <rect x="131" y="97" width="58" height="14" rx="7" fill="#3B8B76" fill-opacity="0.18"/>
  <text x="160" y="108" font-family="'Outfit','Trebuchet MS',sans-serif" font-size="8.5" font-weight="600" fill="#3B8B76" text-anchor="middle" letter-spacing="0.4">Finance</text>
  <rect x="195" y="97" width="76" height="14" rx="7" fill="#3B8B76" fill-opacity="0.18"/>
  <text x="233" y="108" font-family="'Outfit','Trebuchet MS',sans-serif" font-size="8.5" font-weight="600" fill="#3B8B76" text-anchor="middle" letter-spacing="0.4">E-Commerce</text>
</svg>
