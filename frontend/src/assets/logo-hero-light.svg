<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="hHexGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#34936F"/>
      <stop offset="100%" stop-color="#235E4C"/>
    </linearGradient>
    <!-- Google Fonts: Outfit for the wordmark, loaded via image viewers that support SVG fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;400&amp;display=swap');
      .wmark { font-family: 'Outfit', 'Trebuchet MS', sans-serif; font-weight: 700; fill: #1E2933; letter-spacing: -0.5px; }
      .sub   { font-family: 'Outfit', 'Trebuchet MS', sans-serif; font-weight: 400; fill: #5A6B7A; letter-spacing: 0.3px; }
      .accent{ fill: #2E7D64; }
    </style>
  </defs>

  <!-- ── Icon mark (scaled to 96px, centred vertically in 120px canvas) ── -->
  <g transform="translate(12, 12) scale(0.8)">
    <!-- Hexagon -->
    <polygon
      points="60,6 110.8,33 110.8,87 60,114 9.2,87 9.2,33"
      fill="url(#hHexGrad)"
    />
    <polygon
      points="60,6 110.8,33 110.8,87 60,114 9.2,87 9.2,33"
      fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.18"
    />

    <!-- W bars -->
    <rect x="31.5" y="56"  width="9" height="32" rx="2" fill="#FFFFFF"/>
    <rect x="43.5" y="66"  width="9" height="22" rx="2" fill="#FFFFFF"/>
    <rect x="55.5" y="50"  width="9" height="38" rx="2" fill="#FFFFFF"/>
    <rect x="67.5" y="66"  width="9" height="22" rx="2" fill="#FFFFFF"/>
    <rect x="79.5" y="56"  width="9" height="32" rx="2" fill="#FFFFFF"/>

    <!-- Arrow -->
    <polyline
      points="60,50 60,36 68,43"
      fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    />

    <!-- Floor -->
    <line x1="31.5" y1="88" x2="88.5" y2="88" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- ── Divider ── -->
  <line x1="114" y1="22" x2="114" y2="98" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ── Wordmark ── -->
  <!-- "WEW" in brand green, "SHG" in dark -->
  <text x="130" y="68" class="wmark" font-size="38">
    <tspan class="accent">WEW</tspan><tspan fill="#1E2933">SHG</tspan>
  </text>

  <!-- ── Tagline ── -->
  <text x="131" y="90" class="sub" font-size="11" letter-spacing="0.8">
    Wanguhu Estate Welfare · Self Help Group
  </text>

  <!-- ── Two micro-badges: Finance · E-Commerce ── -->
  <!-- Badge 1 -->
  <rect x="131" y="97" width="58" height="14" rx="7" fill="#2E7D64" fill-opacity="0.10"/>
  <text x="160" y="108" font-family="'Outfit','Trebuchet MS',sans-serif" font-size="8.5" font-weight="600" fill="#2E7D64" text-anchor="middle" letter-spacing="0.4">Finance</text>
  <!-- Badge 2 -->
  <rect x="195" y="97" width="76" height="14" rx="7" fill="#2E7D64" fill-opacity="0.10"/>
  <text x="233" y="108" font-family="'Outfit','Trebuchet MS',sans-serif" font-size="8.5" font-weight="600" fill="#2E7D64" text-anchor="middle" letter-spacing="0.4">E-Commerce</text>
</svg>
